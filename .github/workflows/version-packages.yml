# Consumes changesets and commits version + changelog to `main` (no second PR for that step).
# After a version commit, calls Publish as a reusable workflow so npm does not depend on
# a PAT tag-push (GITHUB_TOKEN tag pushes do not start other workflows).

name: Version packages

on:
  push:
    branches:
      - main

concurrency:
  group: version-packages-on-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.tag.outputs.should_publish }}
      publish_ref: ${{ steps.tag.outputs.publish_ref }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js (for pending-changeset check only)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect pending changesets
        id: pending
        run: |
          if node scripts/has-pending-changesets.cjs; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.pending.outputs.ready == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (with pnpm cache for install)
        if: steps.pending.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.pending.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run version packages
        if: steps.pending.outputs.ready == 'true'
        run: pnpm run version-packages

      - name: Commit and push to main
        id: auto_commit
        if: steps.pending.outputs.ready == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: version packages [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # Tag with GITHUB_TOKEN (will not trigger Publish). Publish runs via workflow_call below.
      - name: Push version tag
        id: tag
        if: steps.pending.outputs.ready == 'true' && steps.auto_commit.outputs.commit_hash != ''
        env:
          COMMIT_HASH: ${{ steps.auto_commit.outputs.commit_hash }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Remote tag ${TAG} already exists; skipping tag push and publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "${TAG}" "${COMMIT_HASH}"
          git push origin "refs/tags/${TAG}"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "publish_ref=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: version
    if: needs.version.outputs.should_publish == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      checkout_ref: ${{ needs.version.outputs.publish_ref }}
