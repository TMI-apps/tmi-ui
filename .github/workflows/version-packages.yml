# Consumes changesets and commits version + changelog to `main` (no second PR for that step).

name: Version packages

on:
  push:
    branches:
      - main

concurrency:
  group: version-packages-on-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js (for pending-changeset check only)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect pending changesets
        id: pending
        run: |
          if node scripts/has-pending-changesets.cjs; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.pending.outputs.ready == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (with pnpm cache for install)
        if: steps.pending.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.pending.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run version packages
        if: steps.pending.outputs.ready == 'true'
        run: pnpm run version-packages

      - name: Commit and push to main
        id: auto_commit
        if: steps.pending.outputs.ready == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: version packages [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # Pushes using the default GITHUB_TOKEN do not trigger other workflows (e.g. Publish on tag).
      # Use a PAT so the tag push runs as a real user and starts the Publish workflow.
      # Secret: classic PAT with `repo`, or fine-grained PAT with Contents: Read and write on this repo.
      - name: Push version tag
        if: steps.pending.outputs.ready == 'true' && steps.auto_commit.outputs.commit_hash != ''
        env:
          COMMIT_HASH: ${{ steps.auto_commit.outputs.commit_hash }}
          TAG_PUSH_TOKEN: ${{ secrets.TAG_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Remote tag ${TAG} already exists; skipping."
            exit 0
          fi
          git tag "${TAG}" "${COMMIT_HASH}"
          if [ -n "${TAG_PUSH_TOKEN}" ]; then
            git remote set-url origin "https://x-access-token:${TAG_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            echo "::warning::TAG_PUSH_TOKEN secret is not set. Tag is pushed with GITHUB_TOKEN; the Publish workflow will NOT start automatically. Add repo secret TAG_PUSH_TOKEN (PAT with repo scope), or run Publish manually for this tag (Actions → Publish → Run workflow)."
          fi
          git push origin "refs/tags/${TAG}"
