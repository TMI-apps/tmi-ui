# Publish to the public npm registry.
#
# Triggers:
# - Version packages calls this as a reusable workflow after it bumps + tags (auto-publish).
# - Push of a v* tag (manual tag from a maintainer machine).
# - workflow_dispatch (fallback / retry).
#
# Auth: npm Trusted Publisher (OIDC) when NPM_TOKEN is unset. Repository secret NPM_TOKEN
# is used as a fallback (workflow_call must use secrets: inherit from the caller).
name: Publish

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git SHA or tag to check out and publish
        type: string
        required: true
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run (e.g. manual after tag)"
        required: false
        default: "manual"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        run: |
          if [ -n "${{ inputs.checkout_ref }}" ]; then
            echo "ref=${{ inputs.checkout_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout_ref.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --no-git-checks
