# Publish to the public npm registry when a version tag (v*) is pushed.
# Tags are normally created by the Version packages workflow after changesets merge.
# workflow_dispatch lets you re-run when a prior tag did not trigger (e.g. workflow added later).
name: Publish

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run (e.g. manual after tag)"
        required: false
        default: "manual"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance + Trusted Publishing (OIDC), if enabled for this package on npmjs
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Authentication: add repo secret NPM_TOKEN (automation/granular token), and/or configure
      # Trusted Publishing on npmjs for this repo — see docs/release-flow.md
      - name: Publish to npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
