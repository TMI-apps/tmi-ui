# Publish to the public npm registry.
#
# Triggers:
# - Version packages calls this as a reusable workflow after it bumps + tags (auto-publish).
# - Push of a v* tag (manual tag from a maintainer machine).
# - workflow_dispatch (fallback / retry).
#
# Auth: npm Trusted Publisher (OIDC) for repo TMI-apps/tmi-ui, workflow file publish.yml.
# Do not set NODE_AUTH_TOKEN or setup-node registry-url on publish — those write .npmrc
# auth and npm then skips OIDC (surfaces as E404 on PUT).
name: Publish

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git SHA or tag to check out and publish
        type: string
        required: true
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run (e.g. manual after tag)"
        required: false
        default: "manual"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: npm publish --access public --no-git-checks
