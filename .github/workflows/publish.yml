# Publish to GitHub Packages when a version tag (v*) is pushed.
# Tags are normally created by the Version packages workflow after changesets merge.
# workflow_dispatch lets you re-run when a prior tag did not trigger (e.g. workflow added later).
name: Publish

# Tag push: must match (glob). `workflow_dispatch` lets you re-run when a prior tag
# did not trigger (e.g. workflow added after the tag was first seen).
# `release: published` runs when a GitHub Release is published (optional backup).
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run (e.g. manual after tag)"
        required: false
        default: "manual"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          always-auth: true
          scope: "@tmi-apps"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm run build

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
