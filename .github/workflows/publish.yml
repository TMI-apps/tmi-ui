# Publish to the public npm registry when a version tag (v*) is pushed.
# Tags are normally created by the Version packages workflow after changesets merge.
# workflow_dispatch lets you re-run when a prior tag did not trigger (e.g. workflow added later).
#
# Auth: npm Trusted Publisher (OIDC) for repo TMI-apps/tmi-ui, workflow file publish.yml.
# Do not set NODE_AUTH_TOKEN or setup-node registry-url on publish — those write .npmrc
# auth and npm then skips OIDC (surfaces as E404 on PUT).
name: Publish

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run (e.g. manual after tag)"
        required: false
        default: "manual"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: npm publish --access public --no-git-checks
